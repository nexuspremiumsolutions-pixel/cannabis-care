    <script>
      // Filter benign Vite WebSocket disconnection messages in iframe/container preview
      (function() {
        var originalError = console.error;
        var originalWarn = console.warn;
        function isViteHmr(args) {
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            var str = '';
            try {
              if (typeof item === 'string') {
                str = item;
              } else if (item && typeof item === 'object') {
                str = item.message || item.reason || (item.constructor ? item.constructor.name : '') || String(item);
              } else {
                str = String(item);
              }
            } catch (e) {
              str = '';
            }
            if (
              str &&
              (str.indexOf('[vite]') !== -1 ||
               str.toLowerCase().indexOf('websocket') !== -1 ||
               str.toLowerCase().indexOf('failed to connect') !== -1)
            ) {
              return true;
            }
          }
          return false;
        }

        console.error = function() {
          if (isViteHmr(arguments)) {
            return;
          }
          originalError.apply(console, arguments);
        };

        console.warn = function() {
          if (isViteHmr(arguments)) {
            return;
          }
          originalWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason ? (event.reason.message || String(event.reason)) : '');
          if (reason && (reason.indexOf('[vite]') !== -1 || reason.toLowerCase().indexOf('websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || '');
          if (msg && (msg.indexOf('[vite]') !== -1 || msg.toLowerCase().indexOf('websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
